<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="project.css">
</head>
<body class="auth-page">
    <div class="signupbox">
    <h2>Sign Up</h2>
    <form id="signupForm">
        <input type="text" id="fullName" placeholder="FullName">
        <br> <br>
        <input type="email" id="email" placeholder="Email Address">
        <br> <br>
        <input type="password" id="password" placeholder="password">
        <br> <br>
        <input type="password" id="confirmPassword"  placeholder="Confirm Password">
        <br> <br>
        <div class="checkbox-field">
          <input type="checkbox" id="agreeTerms" name="agreeTerms">
          <label for="agreeTerms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label>
        </div>
        <button type="submit">Sign Up</button>
    </form>
    <div class="SignIn">
    <p>Already have an account? <a href="sign-in.html" class="login-link">Login</a></p>
    </div>
    </div>

    <script>
      let users = JSON.parse(localStorage.getItem('SeptUsers26')) || []

      document.getElementById('signupForm').addEventListener('submit', signUserUp)

      function signUserUp(ev) {
        ev.preventDefault()
        let email = document.getElementById('email').value.toLowerCase().trim()
        let password = document.getElementById('password').value.trim()
        let confirmPassword = document.getElementById('confirmPassword').value.trim()
        let fullName = document.getElementById('fullName').value.trim()
        let agreeTerms = document.getElementById('agreeTerms')

        if (!email || !password || !confirmPassword || !fullName) {
          alert("all fields are mandatory")
        }
        else if (!agreeTerms.checked) {
          alert("please agree to terms and conditions")
        }
        else if (users.find((user) => { return user.email === email })) {
          alert('user already exists')
        }
        else if (password !== confirmPassword) {
          alert('passwords must match')
        }
        else if (password.length < 8) {
          alert('passwords must be at least 8 characters')
        }
        else {
          let user = {
            fullName,
            password,
            email,
            isAgreed: agreeTerms.checked
          }

          users.push(user)
          localStorage.setItem('SeptUsers26', JSON.stringify(users))

          alert('signUp successful!')
          location.href = 'sign-in.html'
        }
      } 
    </script>
</body>
</html>
